            background: rgba(20, 25, 40, 0.9);

            text-align: center;
            max-width: 550px;
            width: 100%;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        }

            width: 100%;
            padding: 18px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 60px;
            background: #2a3050;
            color: #fff;
            outline: 2px solid #3e4a7a;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #888;
        }
        button {
            background: #6c5ce7;
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            box-shadow: 0 0 20px #6c5ce7aa;
            width: 100%;
        }
        button:hover {
            background: #5a4bd1;
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            margin-top: 25px;
            background: #0e121f;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            border-left: 6px solid #6c5ce7;
            display: none;
            max-height: 450px;
            overflow-y: auto;
        }
        .result-box.visible {
            display: block;
        }
        .result-box h3 {
            margin-top: 0;
            color: #a29bfe;
            font-size: 1.1rem;
        }
        .result-box p {
            margin: 8px 0;
            font-size: 0.95rem;
        }
        .result-box .label {
            color: #888;
        }
        .result-box .value {
            color: #fff;
            font-weight: 600;
        }
        .error {
            color: #ff6b6b;
        }
        .footer-note {
            margin-top: 15px;
            font-size: 0.7rem;
            color: #555;
        }
        .flag {
            font-size: 1.5rem;
            margin-right: 8px;
        }
        .badge {
            display: inline-block;
            background: #6c5ce7;
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
        }
    </style>
</head>

                '49': 'Германия',
                '33': 'Франция',
                '39': 'Италия'
            }[countryCode] || 'Неизвестно';

            let noteHtml = info._note ? `<p style="color:#f9ca24; font-size:0.8rem;">${info._note}</p>` : '';

            content.innerHTML = `
                <h3>${flag} Результат по номеру ${input.value}</h3>
                ${noteHtml}
                <p><span class="label">Оператор:</span> <span class="value">${info.operator}</span></p>
                <p><span class="label">Страна:</span> <span class="value">${countryName}</span></p>
                <p><span class="label">Регион:</span> <span class="value">${info.region}</span></p>
                <p><span class="label">Город:</span> <span class="value">${info.city}</span></p>
                <p><span class="label">Часовой пояс:</span> <span class="value">${info.timezone}</span></p>
                <p><span class="label">Координаты:</span> <span class="value">${info.lat}, ${info.lon}</span></p>
                <p><span class="label">Вероятный адрес:</span> <span class="value">${street}</span></p>
                <p><span class="label">Владелец (демо):</span> <span class="value">${fullName}, ${age} лет</span></p>
                <p style="font-size:0.7rem; color:#555; margin-top:12px; border-top:1px solid #222; padding-top:10px;">
                    ⚡ Данные из открытых источников. Для демонстрации.
                </p>
            `;
            
            resultDiv.classList.add('visible');
            btn.disabled = false;
            btn.textContent = '🔍 Вычислить всё';
        }

        function showError(msg) {
            const resultDiv = document.getElementById('result');
            const content = document.getElementById('resultContent');
            content.innerHTML = `<p class="error">❌ ${msg}</p>`;
            resultDiv.classList.add('visible');
        }

        // Автозапуск при загрузке
        window.onload = function() {
            setTimeout(lookup, 300);
        };
    </script>
</body>
</html>
