<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ROCKET DoS MONITOR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e1a;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #111827;
            border: 2px solid #00ff88;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 60px #00ff8822;
        }
        h1 {
            font-size: 2.2rem;
            text-align: center;
            text-shadow: 0 0 30px #00ff8866;
            margin-bottom: 10px;
        }
        .sub {
            text-align: center;
            color: #88aaff;
            margin-bottom: 25px;
            border-bottom: 1px solid #1a2a3a;
            padding-bottom: 12px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: #0a0f1a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-card .number {
            font-size: 2rem;
            color: #00ff88;
            font-weight: bold;
            display: block;
        }
        .stat-card .label {
            color: #88aaff;
            font-size: 0.8rem;
        }
        .log-panel {
            background: #0a0f1a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-entry {
            padding: 6px 0;
            border-bottom: 1px solid #1a2a3a;
            font-size: 0.8rem;
            color: #88aaff;
        }
        .log-entry .ip {
            color: #00ff88;
            font-weight: bold;
        }
        .log-entry .time {
            color: #446688;
            margin-right: 10px;
        }
        .log-entry .method {
            color: #ffaa44;
        }
        .log-entry .path {
            color: #aaccff;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #00ff88;
            color: #0b0e1a;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 60px;
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .btn:hover {
            background: #44ffaa;
            box-shadow: 0 0 40px #00ff8866;
        }
        .btn-danger {
            background: #ff3355;
            color: #fff;
        }
        .btn-danger:hover {
            background: #ff5577;
            box-shadow: 0 0 30px #ff335566;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }
        .footer {
            text-align: center;
            color: #446688;
            font-size: 0.7rem;
            margin-top: 30px;
        }
        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ ROCKET DoS MONITOR</h1>
        <div class="sub">Реальное время • Твой сайт под защитой</div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <span class="number" id="totalRequests">0</span>
                <span class="label">Всего запросов</span>
            </div>
            <div class="stat-card">
                <span class="number" id="uniqueIPs">0</span>
                <span class="label">Уникальных IP</span>
            </div>
            <div class="stat-card">
                <span class="number" id="activeNow">0</span>
                <span class="label">Активно сейчас</span>
            </div>
            <div class="stat-card">
                <span class="number" id="blockedIPs">0</span>
                <span class="label">Заблокировано IP</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn" id="refreshBtn">🔄 Обновить</button>
            <button class="btn btn-danger" id="clearLogBtn">🗑️ Очистить лог</button>
        </div>

        <div class="log-panel" id="logPanel">
            <div class="log-entry" style="color: #446688; text-align: center; border-bottom: none;">
                ⏳ Ожидание данных... Нажми "Обновить"
            </div>
        </div>

        <div class="footer">
            🔒 Все данные собираются анонимно для защиты от DoS-атак
        </div>
    </div>

    <script>
        // ============================================================
        //  ЭМУЛЯЦИЯ ЛОГА (В РЕАЛЬНОМ ПРОЕКТЕ ЗАМЕНИ НА API)
        // ============================================================
        let logData = [
            { ip: '192.168.1.101', time: '14:23:15', method: 'GET', path: '/' },
            { ip: '192.168.1.105', time: '14:23:18', method: 'POST', path: '/api' },
            { ip: '10.0.0.25', time: '14:23:22', method: 'GET', path: '/static' },
            { ip: '192.168.1.102', time: '14:23:30', method: 'GET', path: '/about' },
            { ip: '192.168.1.101', time: '14:23:35', method: 'GET', path: '/' },
            { ip: '172.16.0.10', time: '14:23:40', method: 'POST', path: '/data' },
            { ip: '192.168.1.105', time: '14:23:45', method: 'GET', path: '/images' },
            { ip: '10.0.0.25', time: '14:23:50', method: 'GET', path: '/' },
            { ip: '192.168.1.101', time: '14:23:55', method: 'GET', path: '/contact' },
            { ip: '192.168.1.103', time: '14:24:00', method: 'GET', path: '/' },
        ];

        let blockedIPs = ['192.168.1.105', '10.0.0.25'];

        // ============================================================
        //  ОБНОВЛЕНИЕ СТАТИСТИКИ
        // ============================================================
        function updateStats() {
            const total = logData.length;
            const unique = new Set(logData.map(entry => entry.ip)).size;
            const active = Math.min(total, 5); // Симуляция активных
            const blocked = blockedIPs.length;

            document.getElementById('totalRequests').textContent = total;
            document.getElementById('uniqueIPs').textContent = unique;
            document.getElementById('activeNow').textContent = active;
            document.getElementById('blockedIPs').textContent = blocked;
        }

        // ============================================================
        //  ОБНОВЛЕНИЕ ЛОГА
        // ============================================================
        function renderLog() {
            const panel = document.getElementById('logPanel');
            if (logData.length === 0) {
                panel.innerHTML = `<div class="log-entry" style="color: #446688; text-align: center; border-bottom: none;">
                    ✅ Лог пуст. Новые запросы появятся здесь.
                </div>`;
                return;
            }

            panel.innerHTML = logData.map(entry => `
                <div class="log-entry">
                    <span class="time">${entry.time}</span>
                    <span class="ip">${entry.ip}</span>
                    <span class="method">${entry.method}</span>
                    <span class="path">${entry.path}</span>
                    ${blockedIPs.includes(entry.ip) ? ' 🛑' : ''}
                </div>
            `).join('');
        }

        // ============================================================
        //  ДОБАВЛЕНИЕ НОВОГО ЗАПРОСА (СИМУЛЯЦИЯ)
        // ============================================================
        function addRandomRequest() {
            const ips = ['192.168.1.101', '192.168.1.102', '192.168.1.103', '192.168.1.104', '192.168.1.105',
                '10.0.0.25', '172.16.0.10', '192.168.1.106', '192.168.1.107', '192.168.1.108'
            ];
            const methods = ['GET', 'POST', 'GET', 'GET', 'POST'];
            const paths = ['/', '/about', '/contact', '/api', '/static', '/images', '/data', '/test'];

            const newEntry = {
                ip: ips[Math.floor(Math.random() * ips.length)],
                time: new Date().toLocaleTimeString('ru-RU'),
                method: methods[Math.floor(Math.random() * methods.length)],
                path: paths[Math.floor(Math.random() * paths.length)]
            };

            logData.unshift(newEntry);
            if (logData.length > 50) logData.pop(); // Ограничиваем размер лога

            // Иногда блокируем IP
            if (Math.random() < 0.1 && !blockedIPs.includes(newEntry.ip)) {
                blockedIPs.push(newEntry.ip);
            }

            updateStats();
            renderLog();
        }

        // ============================================================
        //  УПРАВЛЕНИЕ
        // ============================================================
        document.getElementById('refreshBtn').addEventListener('click', function() {
            // В реальном проекте — запрос к серверу
            addRandomRequest();
            addRandomRequest();
            addRandomRequest();
            this.textContent = '✅ Обновлено!';
            setTimeout(() => { this.textContent = '🔄 Обновить'; }, 2000);
        });

        document.getElementById('clearLogBtn').addEventListener('click', function() {
            logData = [];
            blockedIPs = [];
            updateStats();
            renderLog();
            this.textContent = '🗑️ Очищено!';
            setTimeout(() => { this.textContent = '🗑️ Очистить лог'; }, 2000);
        });

        // ============================================================
        //  АВТООБНОВЛЕНИЕ (РАЗ В 10 СЕКУНД)
        // ============================================================
        setInterval(addRandomRequest, 10000);

        // ============================================================
        //  СТАРТ
        // ============================================================
        updateStats();
        renderLog();
    </script>
</body>
</html>
