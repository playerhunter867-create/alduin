<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Detective</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(20, 25, 40, 0.9);
            backdrop-filter: blur(12px);
            padding: 2.5rem 3rem;
            border-radius: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 18px 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 60px;
            background: #2a3050;
            color: #fff;
            outline: 2px solid #3e4a7a;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #888;
        }
        button {
            background: #6c5ce7;
            color: #fff;
            border: none;
            padding: 16px 40px;
            font-size: 1.2rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
            box-shadow: 0 0 20px #6c5ce7aa;
            width: 100%;
        }
        button:hover {
            background: #5a4bd1;
            transform: scale(1.02);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            margin-top: 25px;
            background: #0e121f;
            padding: 20px;
            border-radius: 20px;
            text-align: left;
            border-left: 6px solid #6c5ce7;
            display: none;
        }
        .result-box.visible {
            display: block;
        }
        .result-box h3 {
            margin-top: 0;
            color: #a29bfe;
            font-size: 1.1rem;
        }
        .result-box p {
            margin: 8px 0;
            font-size: 0.95rem;
        }
        .result-box .label {
            color: #888;
        }
        .result-box .value {
            color: #fff;
            font-weight: 600;
        }
        .error {
            color: #ff6b6b;
        }
        .loading {
            color: #f9ca24;
        }
        .footer-note {
            margin-top: 15px;
            font-size: 0.7rem;
            color: #555;
        }
        .flag {
            font-size: 1.5rem;
            margin-right: 8px;
        }
    </style>
</head>

    <div class="container">

        // ============================================================
        // 2. ЛОГИКА ОПРЕДЕЛЕНИЯ
        // ============================================================
        function getCountryCode(raw) {
            if (raw.startsWith('7')) return '7';
            if (raw.startsWith('1')) return '1';
            if (raw.startsWith('44')) return '44';
            if (raw.startsWith('49')) return '49';
            if (raw.startsWith('33')) return '33';
            if (raw.startsWith('39')) return '39';
            return '7'; // по умолчанию Россия
        }

        function lookup() {
            const input = document.getElementById('phoneInput');
            const btn = document.getElementById('lookupBtn');
            const resultDiv = document.getElementById('result');
            const content = document.getElementById('resultContent');
            
            // Блокируем кнопку
            btn.disabled = true;
            btn.textContent = '⏳ Загрузка...';
            resultDiv.classList.remove('visible');
            
            // Очищаем номер
            let raw = input.value.replace(/\D/g, '');
            if (raw.length < 7) {
                showError('Слишком короткий номер (минимум 7 цифр)');
                btn.disabled = false;
                btn.textContent = '🔍 Вычислить всё';
                return;
            }

            // Определяем страну
            let countryCode = getCountryCode(raw);
            let rest = raw;
            
            // Убираем код страны
            if (raw.startsWith('44') || raw.startsWith('49') || raw.startsWith('33') || raw.startsWith('39')) {
                rest = raw.slice(2);
            } else if (raw.startsWith('7') || raw.startsWith('1')) {
                rest = raw.slice(1);
            }
            
            // Берём первые 3 цифры (DEF-код)
            if (rest.length < 3) {
                showError('Недостаточно цифр после кода страны');
                btn.disabled = false;
                btn.textContent = '🔍 Вычислить всё';
                return;
            }
            
            const defCode = rest.slice(0, 3);
            
            // Ищем в базе
            const countryData = OPERATOR_DB[countryCode];
            if (!countryData) {
                showError(`Страна с кодом ${countryCode} не найдена в базе`);
                btn.disabled = false;
                btn.textContent = '🔍 Вычислить всё';
                return;
            }
            
            const info = countryData[defCode];
            if (!info) {
                showError(`DEF-код ${defCode} для страны ${countryCode} не найден`);
                btn.disabled = false;
                btn.textContent = '🔍 Вычислить всё';
                return;
            }

            // ============================================================
            // 3. ГЕНЕРАЦИЯ ДЕМО-ДАННЫХ (ФИО, адрес)
            // ============================================================
            const names = ['Иванов Иван Иванович', 'Петров Пётр Петрович', 'Сидоров Сидор Сидорович',
                           'Кузнецова Анна Сергеевна', 'Смирнов Алексей Владимирович', 
                           'Попов Дмитрий Алексеевич', 'Соколова Елена Петровна', 'Лебедев Андрей Николаевич',
                           'Козлов Максим Александрович', 'Новикова Ольга Владимировна'];
            const streets = ['Ленина', 'Пушкина', 'Гагарина', 'Советская', 'Мира', 'Центральная', 
                            'Садовый проезд', 'Набережная', 'Молодёжная', 'Строителей'];
            
            const fullName = names[Math.floor(Math.random() * names.length)];
            const age = Math.floor(Math.random() * (75 - 18 + 1)) + 18;
            const street = `ул. ${streets[Math.floor(Math.random() * streets.length)]}, д. ${Math.floor(Math.random() * 150) + 1}`;
            
            // Флаг страны
            const flags = {
                '7': '🇷🇺',
                '1': '🇺🇸',
                '44': '🇬🇧',
                '49': '🇩🇪',
                '33': '🇫🇷',
                '39': '🇮🇹'
            };
            const flag = flags[countryCode] || '🌍';

            // ============================================================
            // 4. ОТОБРАЖЕНИЕ РЕЗУЛЬТАТА
            // ============================================================
            content.innerHTML = `
                <h3>${flag} Результат по номеру ${input.value}</h3>
                <p><span class="label">Оператор:</span> <span class="value">${info.operator}</span></p>
                <p><span class="label">Страна:</span> <span class="value">${countryCode === '7' ? 'Россия' : 
                                                                        countryCode === '1' ? 'США' :
                                                                        countryCode === '44' ? 'Великобритания' :
                                                                        countryCode === '49' ? 'Германия' :
                                                                        countryCode === '33' ? 'Франция' :
                                                                        countryCode === '39' ? 'Италия' : 'Неизвестно'}</span></p>
                <p><span class="label">Регион:</span> <span class="value">${info.region}</span></p>
                <p><span class="label">Город:</span> <span class="value">${info.city}</span></p>
                <p><span class="label">Часовой пояс:</span> <span class="value">${info.timezone}</span></p>
                <p><span class="label">Координаты:</span> <span class="value">${info.lat}, ${info.lon}</span></p>
                <p><span class="label">Вероятный адрес:</span> <span class="value">${street}</span></p>
                <p><span class="label">Владелец (демо):</span> <span class="value">${fullName}, ${age} лет</span></p>
                <p style="font-size:0.7rem; color:#555; margin-top:12px; border-top:1px solid #222; padding-top:10px;">
                    ⚡ Данные получены из открытых источников и сгенерированы для демонстрации
                </p>
            `;
            
            resultDiv.classList.add('visible');
            btn.disabled = false;
            btn.textContent = '🔍 Вычислить всё';
        }

        function showError(msg) {
            const resultDiv = document.getElementById('result');
            const content = document.getElementById('resultContent');
            content.innerHTML = `<p class="error">❌ ${msg}</p>`;
            resultDiv.classList.add('visible');
        }

        // Автозапуск при загрузке (для демонстрации)
        window.onload = function() {
            setTimeout(lookup, 300);
        };
    </script>
